[package]
name = "tiders"
description = "Tiders — a terminal (TUI + CLI) client for the TIDAL music streaming service."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "tiders"

[[bin]]
name = "tiders"
path = "src/main.rs"

[dependencies]
tiders-core.workspace = true
tidlers.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
open = "5"
# Terminal image rendering (sixel/kitty/iterm2 with unicode-halfblock fallback).
# default-features off drops the heavy AV1/AVIF codecs; TIDAL cover art is JPEG.
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
neo_frizbee.workspace = true
