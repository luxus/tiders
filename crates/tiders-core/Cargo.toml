[package]
name = "tiders-core"
description = "Core library for Tiders: TIDAL session/auth, catalog access, playback engine, and queue. Reusable by the CLI, TUI, and future GUI/daemon front-ends."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tidlers.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
tracing.workspace = true
# Public cover-art fetches from resources.tidal.com (no auth needed).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
