[package]
name = "tiders-core"
description = "Core library for Tiders: TIDAL session/auth, catalog access, playback engine, and queue. Reusable by the CLI, TUI, and future GUI/daemon front-ends."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tidlers.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
tracing.workspace = true
rand.workspace = true
rustfft.workspace = true
png = "0.17"
# Public cover-art fetches from resources.tidal.com (no auth needed).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# OS media controls: MPRIS on Linux (pure-Rust zbus), Now Playing on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8"
objc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }

# `objc` 0.2's `msg_send!` / `class!` probe `feature = "cargo-clippy"`. Without
# this, `clippy -D warnings` on macOS fails with unexpected_cfgs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
